      <circle cx="70" cy="50" r="12" fill="#ff6644"/>
      <circle cx="70" cy="110" r="30" fill="#ff1801"/>
      <circle cx="70" cy="110" r="12" fill="#ff6644"/>
      <circle cx="70" cy="170" r="30" fill="#ff1801"/>
      <circle cx="70" cy="170" r="12" fill="#ff6644"/>
    </g>
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="140" height="200" rx="16" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
      <circle cx="70" cy="50" r="30" fill="#ff1801"/>
      <circle cx="70" cy="50" r="12" fill="#ff6644"/>
      <circle cx="70" cy="110" r="30" fill="#ff1801"/>
      <circle cx="70" cy="110" r="12" fill="#ff6644"/>
      <circle cx="70" cy="170" r="30" fill="#ff1801"/>
      <circle cx="70" cy="170" r="12" fill="#ff6644"/>
    </g>
    <g transform="translate(320, 0)">
      <rect x="0" y="0" width="140" height="200" rx="16" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
      <circle cx="70" cy="50" r="30" fill="#ff1801"/>
      <circle cx="70" cy="50" r="12" fill="#ff6644"/>
      <circle cx="70" cy="110" r="30" fill="#ff1801"/>
      <circle cx="70" cy="110" r="12" fill="#ff6644"/>
      <circle cx="70" cy="170" r="30" fill="#ff1801"/>
      <circle cx="70" cy="170" r="12" fill="#ff6644"/>
    </g>
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="140" height="200" rx="16" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
      <circle cx="70" cy="50" r="30" fill="#ff1801"/>
      <circle cx="70" cy="50" r="12" fill="#ff6644"/>
      <circle cx="70" cy="110" r="30" fill="#ff1801"/>
      <circle cx="70" cy="110" r="12" fill="#ff6644"/>
      <circle cx="70" cy="170" r="30" fill="#ff1801"/>
      <circle cx="70" cy="170" r="12" fill="#ff6644"/>
    </g>
    <g transform="translate(640, 0)">
      <rect x="0" y="0" width="140" height="200" rx="16" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
      <circle cx="70" cy="50" r="30" fill="#ff1801"/>
      <circle cx="70" cy="50" r="12" fill="#ff6644"/>
      <circle cx="70" cy="110" r="30" fill="#ff1801"/>
      <circle cx="70" cy="110" r="12" fill="#ff6644"/>
      <circle cx="70" cy="170" r="30" fill="#ff1801"/>
      <circle cx="70" cy="170" r="12" fill="#ff6644"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="480" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#fff">LIGHTS OUT!</text>
  <text x="600" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#666" letter-spacing="8">F1 REACTION CHALLENGE</text>

  <!-- Call to action -->
  <text x="600" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ff1801">Can you beat an F1 driver? → f1lightsoutgame.site</text>
